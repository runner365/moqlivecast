[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamvox"
version = "0.1.0"
description = "StreamVox — WebSocket voice agent with an OpenAI Realtime-compatible protocol"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "dashscope>=1.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "websockets>=12",
]

[project.scripts]
streamvox = "streamvox.__main__:main"

[tool.setuptools.packages.find]
include = ["streamvox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
